[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/haberler/*"
  to = "/blog/"
  status = 301
  force = true

[processing]
  skip_processing = false
[processing.css]
  bundle = false
  minify = true
[processing.js]
  bundle = false
  minify = true
[processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
